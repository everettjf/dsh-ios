# CI for dsh-ios: emulator + rootfs + simulator XCTest, all unattended.
# Needs a macOS Apple Silicon runner with Xcode 26+ (macos-15-xlarge or self-hosted).
name: dsh-ios
on:
  push:
    paths: ['dsh-ios/**', 'ish-arm64/**', '.github/workflows/dsh-ios.yml']
  pull_request:
    paths: ['dsh-ios/**', 'ish-arm64/**']
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-15-xlarge
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: { submodules: false }
      - name: Tools
        run: |
          brew install meson ninja
          gem list xcodeproj -i || sudo gem install xcodeproj
          node -v && npm -v
      - name: Emulator (iSH-ARM64 CLI)
        run: make -C dsh-ios emulator
      - name: Emulator regression tests
        run: make -C dsh-ios test-emu
      - name: Root filesystem
        run: make -C dsh-ios rootfs
      - name: Rootfs integration tests
        run: make -C dsh-ios test-rootfs
      - name: Unit + UI tests on the simulator
        run: make -C dsh-ios test-sim TEAM= SIM="iPad Air 11-inch (M4)"
      - name: Unsigned device build (archive-ability)
        run: |
          cd dsh-ios && xcodebuild -project DSH.xcodeproj -scheme DSH -configuration Release \
            -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO DSH_DEVELOPMENT_TEAM= build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dsh-ios-results
          path: |
            dsh-ios/build/*.xcresult
            dsh-ios/build/root.tar.gz.sha256
