# CI for dsh-ios: the emulator, the guest image and the app's test suites.
#
# Runs on GitHub's standard macOS runner, which is Apple Silicon (required: the
# emulator's gadgets are arm64 assembly) and free for public repositories.
name: dsh-ios
on:
  push:
    branches: [main]
    paths-ignore: ['site/**', '.github/workflows/pages.yml', '**/*.md']
  pull_request:
    paths-ignore: ['site/**', '**/*.md']
  workflow_dispatch:

jobs:
  emulator:
    name: Emulator + guest image
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          brew install meson ninja lld
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"   # ld.lld, needed for the guest VDSO
      - name: Build the emulator
        run: make emulator
      - name: Emulator regression tests
        run: make test-emu
      - name: Build the guest image
        run: make rootfs
      - name: Rootfs + host bridge integration tests
        run: make test-rootfs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rootfs-logs
          path: |
            build/root.tar.gz.sha256
            build/rootfs-test/*.log
            build/rootfs-test/*.txt
          if-no-files-found: ignore

  app:
    name: App build + tests (simulator)
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          brew install meson ninja lld
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"   # ld.lld, needed for the guest VDSO
          gem list xcodeproj -i || sudo gem install xcodeproj --no-document
      - name: Build the emulator (needed to produce the guest image)
        run: make emulator
      - name: Build the guest image
        run: make rootfs
      - name: Unsigned device build
        run: |
          make project
          xcodebuild -project DSH.xcodeproj -scheme DSH -configuration Release \
            -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO DSH_DEVELOPMENT_TEAM= build
      - name: Unit + UI tests on the simulator
        run: make test-sim TEAM= SIM="$(scripts/pick-simulator.sh)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xcresults
          path: build/*.xcresult
          if-no-files-found: ignore
